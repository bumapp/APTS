# Deterministic sticky router in front of the juice-shop replicas.
#
# Why NOT `hash ... consistent`: consistent hashing of our small key set (a few
# dozen weakness ids) piled ALL shards onto 3 of 8 replicas and left the rest idle
# — ketama optimises for minimal remap when servers change, not for even spread of
# few keys. Our server set is fixed, so we don't need that; we need each concurrent
# proof on its OWN replica.
#
# So the exploit worker hands each in-flight proof a slot number from a pool sized
# to the replica count (X-APTS-Shard: "slotN"), and we map slotN -> replica N+1
# here. All requests of one proof carry the same slot, so a proof stays pinned to
# one replica (sqlmap stateful detection / sessions / stored XSS need that), while
# different concurrent proofs get different slots -> different replicas -> even load.
# Keep this map's size == the replica count == APTS_TARGET_REPLICAS. No/unknown
# shard (e.g. the recon crawl) falls through to replica 1.

log_format sticky '$time_iso8601 shard=$http_x_apts_shard -> $upstream_addr '
                  '$status "$request"';

map $http_x_apts_shard $js_backend {
    default  juice-shop-1:3000;
    slot0    juice-shop-1:3000;
    slot1    juice-shop-2:3000;
    slot2    juice-shop-3:3000;
    slot3    juice-shop-4:3000;
    slot4    juice-shop-5:3000;
    slot5    juice-shop-6:3000;
    slot6    juice-shop-7:3000;
    slot7    juice-shop-8:3000;
    slot8    juice-shop-9:3000;
    slot9    juice-shop-10:3000;
}

server {
    listen 3000;
    server_name juice-shop;
    # Docker's embedded DNS — needed because proxy_pass uses a variable, which
    # makes nginx resolve the backend name per request instead of at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    access_log /dev/stdout sticky;

    location / {
        proxy_pass http://$js_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;   # sqlmap time-based probes can be slow
        proxy_send_timeout 300s;
    }
}
