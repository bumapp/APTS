# =========================================================================
#  APTS Skeleton — full deployment on a single Linux host
#
#  Design change from v1: no `.env` file is used.  Configuration is split
#  cleanly into two directories on the host:
#
#      ./tokens/       — one file per secret (raw bearer tokens, DB password)
#                        mounted read-only into containers as Docker secrets.
#      ./config/       — one file per non-secret setting (log_level,
#                        target_allowlist, stub_failure_rate) mounted
#                        read-only into every Python container.
#
#  The database container reads its password via POSTGRES_PASSWORD_FILE.
#  The Python containers read the same password via shared/db.py, which
#  constructs the DSN at runtime — so the raw password never appears in an
#  environment variable and never leaks through `docker inspect`.
# =========================================================================

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  image: apts-skeleton:latest
  restart: unless-stopped
  networks:
    - apts-net

# Shared config-mount block, reused by every Python service.
x-config-mount: &config-mount
  - ./config:/etc/apts/config:ro

# LLM provider settings, shared by all six agents.
#
# Non-secret only.  Values come from ./.env (see .env.example) with defaults
# that work out of the box.  The API KEY is deliberately absent: it is a
# file-mounted Docker secret like the DB password, so it never lands in an
# environment variable and never shows up in `docker inspect`.
x-llm-env: &llm-env
  # The agentic loops (recon/vuln/mitre/exploit/script/adviser) all run on the
  # LangGraph engine (create_react_agent + a shared ChatOpenAI). The model
  # endpoint itself is set per service below via APTS_LOOP_LLM_URL / _MODEL /
  # _TIMEOUT; the bearer key is a file-mounted Docker secret, never an env var.
  #
  # 1 = orchestrator drives the pipeline (agents report done, orchestrator
  # dispatches the next stage with a directive). 0 = original agent self-chaining.
  # MUST match the orchestrator's own setting below.
  APTS_ORCHESTRATOR_DRIVEN:  ${APTS_ORCHESTRATOR_DRIVEN:-1}
  # Opt back in to provider-side retention (send no store=false). Leave empty to
  # keep store=false on keyed endpoints; set to 1 for a provider that rejects the
  # `store` field (e.g. DeepSeek's OpenAI-compatible API).
  APTS_LLM_STORE:            ${APTS_LLM_STORE:-}
  # Vuln reflection rounds — 0 disables the "propose more hypotheses" pass that
  # can massively over-generate on some models. Passthrough so it is tunable.
  APTS_VULN_REFLECT_ROUNDS:  ${APTS_VULN_REFLECT_ROUNDS:-}
  # Langfuse observability. Traces are sent only when both keys are present; leave
  # empty to disable (the loop still runs, and the Postgres agent_trace is
  # unaffected). APTS_LANGFUSE_DISABLED=1 forces off.
  LANGFUSE_PUBLIC_KEY:       ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY:       ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST:             ${LANGFUSE_HOST:-https://cloud.langfuse.com}
  APTS_LANGFUSE_DISABLED:    ${APTS_LANGFUSE_DISABLED:-0}

# Shared resource limits for the six working agents.
x-agent-limits: &agent-limits
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
      reservations:
        memory: 64M


services:

  # ---------------------------------------------------------------------
  #  Database
  # ---------------------------------------------------------------------
  database:
    image: postgres:16-bookworm
    container_name: apts-database
    hostname: database
    restart: unless-stopped
    networks:
      - apts-net
    environment:
      POSTGRES_DB: apts
      POSTGRES_USER: apts
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./bootstrap/init_db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./certs/database.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/database.key:/var/lib/postgresql/server.key:ro
      - ./certs/trust-bundle.pem:/var/lib/postgresql/trust-bundle.pem:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_ca_file=/var/lib/postgresql/trust-bundle.pem
        -c listen_addresses=*
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apts -d apts"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  # ---------------------------------------------------------------------
  #  Orchestrator
  # ---------------------------------------------------------------------
  orchestrator:
    <<: *service-base
    container_name: apts-orchestrator
    hostname: orchestrator
    depends_on:
      database: { condition: service_healthy }
    command: python -m orchestrator.main
    environment:
      # Must match the agents' APTS_ORCHESTRATOR_DRIVEN (x-llm-env above).
      APTS_ORCHESTRATOR_DRIVEN: ${APTS_ORCHESTRATOR_DRIVEN:-1}
      # The Composer (chat) drives the hosted AWS model directly, like the agent
      # loops; key comes from the llm_api_key secret below.
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
    secrets:
      - source: orchestrator_token
        target: token
      - source: orchestrator_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/orchestrator.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro
      # The Adviser writes reports here; the Composer serves them for download,
      # read-only (only the Adviser may write).
      - ./reports:/var/apts/reports:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      # The Chat UI (Composer) — open http://127.0.0.1:8090 in a browser.
      - "127.0.0.1:8090:8090"
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  # ---------------------------------------------------------------------
  #  Six working agents — same image, one command, different AGENT_NAME
  # ---------------------------------------------------------------------
  agent-recon:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-recon
    hostname: agent-recon
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: recon
      # Recon is now a loop: the crawl tool runs on mcp-native and the model
      # triages the observed requests, driving the hosted AWS model directly.
      APTS_MCP_URL:          ${APTS_MCP_URL:-http://mcp-native:9000/mcp}
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
      # Recon's client timeout for the crawl tool call MUST exceed the crawler's
      # own CRAWL_MAX_SECONDS budget (mcp_native/crawler/config.py, now 240s) —
      # the browser-driven crawl with route mining/menu expansion legitimately
      # runs that long, and if the client gives up first a still-working crawl
      # becomes an aborted engagement. Kept comfortably above the 240s budget.
      # Recon is the only agent that makes a call this long-lived, so this is set
      # here rather than raising the shared default.
      APTS_HTTP_TIMEOUT: "300"
    secrets:
      - source: agent_recon_token
        target: token
      - source: agent_recon_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-recon.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro

  agent-vuln:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-vuln
    hostname: agent-vuln
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: vuln
      # The vuln worker runs the native-MCP hypothesis loop against mcp-native,
      # driving the hosted AWS model directly (key from the llm_api_key secret).
      APTS_MCP_URL:          ${APTS_MCP_URL:-http://mcp-native:9000/mcp}
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
      APTS_VULN_FORCE_FETCH: ${APTS_VULN_FORCE_FETCH:-0}
      # vuln assesses every high-interest recon request (no count cap in code), so it
      # never bottlenecks the ~50 weaknesses exploit can now take. (The old
      # APTS_VULN_MAX_REQUESTS was dead — nothing read it — so it is gone.)
      APTS_VULN_MAX_STEPS:   ${APTS_VULN_MAX_STEPS:-5}
      APTS_VULN_MAX_TOKENS:  ${APTS_VULN_MAX_TOKENS:-900}
    secrets:
      - source: agent_vuln_token
        target: token
      - source: agent_vuln_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-vuln.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro

  agent-mitre:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-mitre
    hostname: agent-mitre
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: mitre
      # The mitre worker runs the native-MCP ATT&CK-mapping loop against
      # mcp-native (attack_catalog/attack_search/attack_technique), driving the
      # hosted AWS model directly (key from the llm_api_key secret).
      APTS_MCP_URL:          ${APTS_MCP_URL:-http://mcp-native:9000/mcp}
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
      APTS_MITRE_MAX_STEPS:  ${APTS_MITRE_MAX_STEPS:-5}
      APTS_MITRE_MAX_PASSES: ${APTS_MITRE_MAX_PASSES:-3}
    secrets:
      - source: agent_mitre_token
        target: token
      - source: agent_mitre_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-mitre.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro

  agent-exploit:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-exploit
    hostname: agent-exploit
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: exploit
      # The exploit worker runs the native-MCP proof loop against mcp-native
      # (sqlmap/http/recorded-request), driving the hosted AWS model directly.
      APTS_MCP_URL:          ${APTS_MCP_URL:-http://mcp-native:9000/mcp}
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-300}
      APTS_LOOP_MAX_STEPS:   ${APTS_LOOP_MAX_STEPS:-50}
      # How many candidate weaknesses the exploit stage actually tries to prove,
      # and how many it proves at once. 8 replicas behind the sticky LB mean up to
      # CONCURRENCY proofs each land on their own target instance, so a heavy
      # sqlmap run no longer starves the others. Keep CONCURRENCY <= replica count.
      APTS_EXPLOIT_MAX_WEAKNESSES: ${APTS_EXPLOIT_MAX_WEAKNESSES:-50}
      APTS_EXPLOIT_CONCURRENCY: ${APTS_EXPLOIT_CONCURRENCY:-8}
    secrets:
      - source: agent_exploit_token
        target: token
      - source: agent_exploit_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-exploit.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro

  agent-script:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-script
    hostname: agent-script
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: script
      # The script worker runs the native-MCP PoC loop against mcp-native
      # (sandbox_run), driving the hosted AWS model directly (agentic.chat).
      APTS_MCP_URL:          ${APTS_MCP_URL:-http://mcp-native:9000/mcp}
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
    secrets:
      - source: agent_script_token
        target: token
      - source: agent_script_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-script.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro

  agent-adviser:
    <<: [*service-base, *agent-limits]
    container_name: apts-agent-adviser
    hostname: agent-adviser
    depends_on:
      database: { condition: service_healthy }
    command: python -m agent.main
    environment:
      <<: *llm-env
      AGENT_NAME: adviser
      # The adviser's reporting reasoning loop drives the hosted AWS model
      # directly (agentic.chat), like the other loops; key from llm_api_key.
      APTS_LOOP_LLM_URL:     ${APTS_LOOP_LLM_URL:-https://bedrock-mantle.eu-north-1.api.aws/v1/chat/completions}
      APTS_LOOP_LLM_MODEL:   ${APTS_LOOP_LLM_MODEL:-qwen.qwen3-coder-480b-a35b-instruct}
      APTS_LOOP_LLM_TIMEOUT: ${APTS_LOOP_LLM_TIMEOUT:-150}
    secrets:
      - source: agent_adviser_token
        target: token
      - source: agent_adviser_key
        target: tls.key
      - source: db_password
        target: db_password
      - source: llm_api_key
        target: llm_api_key
    volumes:
      - ./certs/agent-adviser.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro
      # The deliverable lands on the host. Adviser is the only writer, so it is
      # the only container that gets this mounted read-write.
      - ./reports:/var/apts/reports

  # ---------------------------------------------------------------------
  #  Local LLM server (optional — profile "localllm")
  #
  #  A self-hosted llama.cpp server so the six agents can run entirely offline,
  #  with no external API key and no per-call quota. Select it at the agent side
  #  by pointing APTS_LOOP_LLM_URL at this service on apts-net
  #  (http://llama:8080/v1/chat/completions). With no key mounted, build_chat_model
  #  treats it as a local llama (keyless, enable_thinking=false). See shared/llm.py.
  #
  #  Gated behind a compose profile so a plain `docker compose up` never starts
  #  it — bring it up explicitly only when you want the local backend:
  #     docker compose --profile localllm up -d llama
  #
  #  The model file is NOT in git (it is 4.7 GB). Fetch it once with
  #  ./bootstrap/fetch_model.sh, which drops it into ./models/ where this mounts.
  #
  #  GPU: uses the CUDA image and reserves the host GPU, but LLAMA_NGL defaults
  #  to 0 (CPU inference) because a 4.7 GB Q4 model does not fit a small card.
  #  Raise LLAMA_NGL to offload N transformer layers onto the GPU if it has the
  #  VRAM. For a CPU-only host, swap the image for ghcr.io/ggml-org/llama.cpp:server
  #  and drop the `deploy.resources.reservations.devices` block below.
  # ---------------------------------------------------------------------
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: localllm-server
    hostname: llama
    profiles: [ localllm ]
    restart: unless-stopped
    networks: [ apts-net ]
    volumes:
      - ./models:/models:ro
    # -a qwen3-8b is a STABLE alias the agents send as the model id; it is just a
    # label, so the actual gguf can be swapped via LLAMA_MODEL_FILE without
    # touching any agent config. --jinja enables the chat template so
    # chat_template_kwargs (enable_thinking=false) is honoured.
    #
    # On a CPU-only / low-VRAM host the 8B default is too slow — point
    # LLAMA_MODEL_FILE at a small model instead, e.g.:
    #   LLAMA_MODEL_FILE=Qwen3-1.7B-Q8_0.gguf docker compose --profile localllm up -d llama
    command: >
      -m /models/${LLAMA_MODEL_FILE:-Qwen3-8B-Q4_K_M.gguf}
      -a qwen3-8b
      --host 0.0.0.0 --port 8080
      -c ${LLAMA_CTX:-8192}
      -ngl ${LLAMA_NGL:-0}
      --threads ${LLAMA_THREADS:-8}
      --parallel ${LLAMA_PARALLEL:-1}
      --jinja
      --reasoning off
    # Published to host loopback too, so you can still curl it on :18080 as
    # before. Not required for the agents, which reach it over apts-net.
    ports:
      - "127.0.0.1:18080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]


  # ---------------------------------------------------------------------
  #  Native MCP server (mcp_native/) — real Model Context Protocol
  #
  #  Distinct from mcp-tools (the REST facade). Serves genuine MCP over
  #  streamable-HTTP at http://mcp-native:9000/mcp, also published to the host
  #  at 127.0.0.1:9000 so an external MCP client / the exploit loop can drive it.
  #
  #  On BOTH networks: apts-net for the database (get_recorded_request), and
  #  apts-target so its tools (http_request, sqlmap) can reach the engagement
  #  target at http://juice-shop:3000/. The sqlmap checkout is mounted read-only.
  #  Standalone: no agent depends on it and it calls no agent.
  # ---------------------------------------------------------------------
  mcp-native:
    build:
      context: .
      dockerfile: mcp_native/Dockerfile
    image: apts-mcp-native:latest
    container_name: apts-mcp-native
    hostname: mcp-native
    restart: unless-stopped
    networks: [ apts-net, apts-target ]
    depends_on:
      database: { condition: service_healthy }
    command: python -m mcp_native.server --http
    environment:
      APTS_SQLMAP_PATH: /opt/sqlmap/sqlmap.py
      APTS_HACKTRICKS_DIR: /opt/hacktricks
      APTS_ATTACK_DIR: /opt/attack
      # The sandbox_run tool calls the sandbox container over TLS.
      APTS_SANDBOX_URL: ${APTS_SANDBOX_URL:-https://sandbox:8443}
    secrets:
      - source: db_password
        target: db_password
      # mcp-native's own bearer token, so the sandbox_run tool can authenticate
      # to the sandbox container (mounted at the load_own_token() default path).
      - source: mcp_native_token
        target: token
    volumes:
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro
      # The user's sqlmap checkout, mounted read-only. Override SQLMAP_DIR to
      # point elsewhere. sqlmap writes only under /tmp (see sqlmap_tool.py).
      - ${SQLMAP_DIR:-/home/asqwe/project/EXPLOIT/sqlmap-dev}:/opt/sqlmap:ro
      # HackTricks web-pentest corpus (overview + technique articles), read-only.
      - ./mcp_native/corpus/hacktricks:/opt/hacktricks:ro
      # Curated MITRE ATT&CK technique catalogue for the mapping loop, read-only.
      - ./mcp_native/corpus/attack:/opt/attack:ro
    ports:
      - "127.0.0.1:9000:9000"
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "1.5" }


  # ---------------------------------------------------------------------
  #  Practice target — OWASP Juice Shop
  #
  #  A deliberately vulnerable web app, so the pipeline has something real to
  #  point at.  It sits on `apts-target`, an `internal: true` network with no
  #  route off the host: the target cannot reach the internet, and nothing
  #  outside the two containers joined to that network can reach the target.
  #  That satisfies the isolation NFR (§8) for the components that exist today
  #  and keeps a genuinely vulnerable app from being exposed by accident.
  #
  #  Reachable from mcp-tools (which runs the scanning tools) as
  #  http://juice-shop:3000/.  Deliberately NOT published to the host — add a
  #  `ports:` mapping yourself if you want to browse it, and understand that
  #  doing so puts a vulnerable app on your network.
  # ---------------------------------------------------------------------
  #  This training app leaks/over-allocates under aggressive concurrent fuzzing and
  #  hits "JavaScript heap out of memory" no matter how much RAM/heap it is given
  #  (verified: 2 GB + a 1.5 GB V8 heap still crash-looped). More memory does NOT
  #  help; spreading the load does. So the engagement target `juice-shop` is an nginx
  #  sticky LB in front of N identical replicas: each exploit proof is pinned (by the
  #  X-APTS-Shard header the exploit worker sets) to ONE replica, so stateful detection
  #  (sqlmap boolean-blind/UNION, login sessions, stored XSS) stays consistent, while
  #  different weaknesses spread across replicas and no single instance is overloaded.
  #  The exploit tool wrapper still retries the connection drop if a replica briefly
  #  restarts (see common_agentic). Scale the pool by adding a juice-shop-N service
  #  plus a matching `server` line in config/juice-shop-lb.conf. Agents still target
  #  http://juice-shop:3000/ — only the LB is addressed; the replicas are internal to
  #  its upstream and never named by the agents. This is lab-only horizontal scale.
  juice-shop-1: &juice-shop-replica
    image: bkimminich/juice-shop:v17.1.1
    container_name: apts-juice-shop-1
    hostname: juice-shop-1
    restart: unless-stopped
    networks: [ apts-target ]
    environment:
      NODE_ENV: unsafe
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
  juice-shop-2:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-2
    hostname: juice-shop-2
  juice-shop-3:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-3
    hostname: juice-shop-3
  juice-shop-4:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-4
    hostname: juice-shop-4
  juice-shop-5:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-5
    hostname: juice-shop-5
  juice-shop-6:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-6
    hostname: juice-shop-6
  juice-shop-7:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-7
    hostname: juice-shop-7
  juice-shop-8:
    <<: *juice-shop-replica
    container_name: apts-juice-shop-8
    hostname: juice-shop-8

  # The engagement target name/URL is preserved: this nginx IS `juice-shop:3000`.
  juice-shop:
    image: nginx:1.27-alpine
    container_name: apts-juice-shop
    hostname: juice-shop
    restart: unless-stopped
    networks: [ apts-target ]
    volumes:
      - ./config/juice-shop-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ juice-shop-1, juice-shop-2, juice-shop-3, juice-shop-4,
                  juice-shop-5, juice-shop-6, juice-shop-7, juice-shop-8 ]

  # ---------------------------------------------------------------------
  #  Sandbox (locked-down stub)
  # ---------------------------------------------------------------------
  sandbox:
    <<: *service-base
    container_name: apts-sandbox
    hostname: sandbox
    # apts-net for the audit DB and to receive /exec from mcp-native; apts-target
    # (internal, no internet) so a PoC script can reach the engagement target.
    networks: [ apts-net, apts-target ]
    depends_on:
      database: { condition: service_healthy }
    command: python -m sandbox.main
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: sandbox_token
        target: token
      - source: sandbox_key
        target: tls.key
      - source: db_password
        target: db_password
    volumes:
      - ./certs/sandbox.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
      - ./config:/etc/apts/config:ro
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5", pids: 64 }


# =========================================================================
#  Volumes, networks, and secrets
# =========================================================================
volumes:
  db_data: {}

networks:
  apts-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: apts0

  # Engagement target network.  `internal: true` means Docker attaches no
  # gateway: containers here have no route off the host.  This is the isolation
  # boundary the Dynamic Simulation Engine will also provision into, one network
  # per engagement.
  apts-target:
    driver: bridge
    internal: true

secrets:
  # DB password — mounted into the DB container AND every Python container
  db_password:            { file: ./tokens/db_password.txt }
  # LLM provider API key — mounted into the six agent containers only.
  # Nothing else needs it: the orchestrator coordinates, mcp-tools runs tools,
  # and the sandbox executes commands. None of them call a model.
  llm_api_key:            { file: ./tokens/aws_llm.key }
  # Bearer tokens (one per Python service)
  mcp_native_token:       { file: ./tokens/mcp-native.token }
  orchestrator_token:     { file: ./tokens/orchestrator.token }
  agent_recon_token:      { file: ./tokens/agent-recon.token }
  agent_vuln_token:       { file: ./tokens/agent-vuln.token }
  agent_mitre_token:      { file: ./tokens/agent-mitre.token }
  agent_exploit_token:    { file: ./tokens/agent-exploit.token }
  agent_script_token:     { file: ./tokens/agent-script.token }
  agent_adviser_token:    { file: ./tokens/agent-adviser.token }
  sandbox_token:          { file: ./tokens/sandbox.token }
  # TLS private keys (one per Python service)
  orchestrator_key:       { file: ./certs/orchestrator.key }
  agent_recon_key:        { file: ./certs/agent-recon.key }
  agent_vuln_key:         { file: ./certs/agent-vuln.key }
  agent_mitre_key:        { file: ./certs/agent-mitre.key }
  agent_exploit_key:      { file: ./certs/agent-exploit.key }
  agent_script_key:       { file: ./certs/agent-script.key }
  agent_adviser_key:      { file: ./certs/agent-adviser.key }
  sandbox_key:            { file: ./certs/sandbox.key }
