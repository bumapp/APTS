# =========================================================================
#  APTS Skeleton — full deployment on a single Linux host
#
#  Topology (Characterization §1.2):
#
#     operator ── SSH ─▶ host  ─────────────────────────────────────┐
#                                                                    │
#                    ┌───────────────────────────────────────────────┼─┐
#                    │  Docker bridge network `apts-net`             │ │
#                    │                                               │ │
#                    │   orchestrator ──kickoff──▶ agent-recon       │ │
#                    │       ▲                        │              │ │
#                    │       │  progress              ▼ push         │ │
#                    │       │  updates            agent-vuln        │ │
#                    │       │                        │  ...         │ │
#                    │       │                        ▼              │ │
#                    │       └──── (from every agent) agent-adviser  │ │
#                    │                                │              │ │
#                    │            ▼ writes            ▼ writes       │ │
#                    │   ┌────────database────────┐                  │ │
#                    │                                               │ │
#                    │   mcp-tools ──▶ sandbox                       │ │
#                    └───────────────────────────────────────────────┴─┘
#
#  Container count: 1 DB + 1 orchestrator + 6 agents + 1 mcp-tools + 1 sandbox = 10
#  Idle footprint:  ~1.2 GB RAM, negligible CPU
# =========================================================================

x-service-base: &service-base
  build:
    context: .
    dockerfile: Dockerfile
  image: apts-skeleton:latest
  restart: unless-stopped
  networks:
    - apts-net
  environment:
    APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem"
    APTS_TLS_KEY_FILE: "/run/secrets/tls_key"
    APTS_TLS_CERT_FILE: "/etc/apts/tls.crt"
    APTS_TRUST_BUNDLE:  "/etc/apts/trust-bundle.pem"
    APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}"

x-service-base-limits: &service-limits
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 256M
      reservations:
        memory: 64M


services:

  # ---------------------------------------------------------------------
  #  Database — PostgreSQL 16 (bookworm base for parity with other images)
  # ---------------------------------------------------------------------
  database:
    image: postgres:16-bookworm
    container_name: apts-database
    restart: unless-stopped
    networks:
      - apts-net
    environment:
      POSTGRES_DB: apts
      POSTGRES_USER: apts
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./bootstrap/init_db.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./certs/database.crt:/var/lib/postgresql/server.crt:ro
      - ./certs/database.key:/var/lib/postgresql/server.key:ro
      - ./certs/trust-bundle.pem:/var/lib/postgresql/trust-bundle.pem:ro
    command: >
      postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_ca_file=/var/lib/postgresql/trust-bundle.pem
        -c listen_addresses=*
    secrets:
      - db_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apts -d apts"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }

  # ---------------------------------------------------------------------
  #  Orchestrator
  # ---------------------------------------------------------------------
  orchestrator:
    <<: *service-base
    container_name: apts-orchestrator
    hostname: orchestrator
    depends_on:
      database: { condition: service_healthy }
    command: >
      python -m orchestrator.main
    environment:
      APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem"
      APTS_TLS_KEY_FILE: "/run/secrets/tls_key"
      APTS_TLS_CERT_FILE: "/etc/apts/tls.crt"
      APTS_TRUST_BUNDLE:  "/etc/apts/trust-bundle.pem"
      APTS_TOKEN_FILE:    "/run/secrets/token"
      APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}"
      APTS_TARGET_ALLOWLIST: "${APTS_TARGET_ALLOWLIST:-}"
    secrets:
      - source: orchestrator_token
        target: token
      - source: orchestrator_key
        target: tls_key
    volumes:
      - ./certs/orchestrator.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
    ports:
      # Admin API (loopback on the host) — used by the operator CLI via docker exec
      - "127.0.0.1:8080:8080"
      # Public HTTPS API — expose to the host loopback for optional external clients
      - "127.0.0.1:8443:8443"
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  # ---------------------------------------------------------------------
  #  Six working agents — same image, one command, different AGENT_NAME
  # ---------------------------------------------------------------------
  agent-recon:    { <<: [*service-base, *service-limits], container_name: apts-agent-recon,   hostname: agent-recon,   command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: recon,   APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_recon_token,   target: token }, { source: agent_recon_key,   target: tls_key } ], volumes: [ "./certs/agent-recon.crt:/etc/apts/tls.crt:ro",    "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }
  agent-vuln:     { <<: [*service-base, *service-limits], container_name: apts-agent-vuln,    hostname: agent-vuln,    command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: vuln,    APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_vuln_token,    target: token }, { source: agent_vuln_key,    target: tls_key } ], volumes: [ "./certs/agent-vuln.crt:/etc/apts/tls.crt:ro",     "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }
  agent-mitre:    { <<: [*service-base, *service-limits], container_name: apts-agent-mitre,   hostname: agent-mitre,   command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: mitre,   APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_mitre_token,   target: token }, { source: agent_mitre_key,   target: tls_key } ], volumes: [ "./certs/agent-mitre.crt:/etc/apts/tls.crt:ro",    "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }
  agent-exploit:  { <<: [*service-base, *service-limits], container_name: apts-agent-exploit, hostname: agent-exploit, command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: exploit, APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_exploit_token, target: token }, { source: agent_exploit_key, target: tls_key } ], volumes: [ "./certs/agent-exploit.crt:/etc/apts/tls.crt:ro",  "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }
  agent-script:   { <<: [*service-base, *service-limits], container_name: apts-agent-script,  hostname: agent-script,  command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: script,  APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_script_token,  target: token }, { source: agent_script_key,  target: tls_key } ], volumes: [ "./certs/agent-script.crt:/etc/apts/tls.crt:ro",   "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }
  agent-adviser:  { <<: [*service-base, *service-limits], container_name: apts-agent-adviser, hostname: agent-adviser, command: python -m agent.main, depends_on: { database: { condition: service_healthy } }, environment: { AGENT_NAME: adviser, APTS_DB_DSN: "postgresql://apts:${APTS_DB_PASSWORD}@database:5432/apts?sslmode=verify-full&sslrootcert=/etc/apts/trust-bundle.pem", APTS_TLS_KEY_FILE: "/run/secrets/tls_key", APTS_TLS_CERT_FILE: "/etc/apts/tls.crt", APTS_TRUST_BUNDLE: "/etc/apts/trust-bundle.pem", APTS_TOKEN_FILE: "/run/secrets/token", APTS_LOG_LEVEL: "${APTS_LOG_LEVEL:-INFO}", APTS_STUB_FAILURE_RATE: "${APTS_STUB_FAILURE_RATE:-0}" }, secrets: [ { source: agent_adviser_token, target: token }, { source: agent_adviser_key, target: tls_key } ], volumes: [ "./certs/agent-adviser.crt:/etc/apts/tls.crt:ro",  "./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro" ] }

  # ---------------------------------------------------------------------
  #  MCP tools (bundled) — embedded outbound Guardrails
  # ---------------------------------------------------------------------
  mcp-tools:
    <<: *service-base
    container_name: apts-mcp-tools
    hostname: mcp-tools
    depends_on:
      database: { condition: service_healthy }
    command: >
      python -m mcp_tools.main
    secrets:
      - source: mcp_tools_token
        target: token
      - source: mcp_tools_key
        target: tls_key
    volumes:
      - ./certs/mcp-tools.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.5" }

  # ---------------------------------------------------------------------
  #  Sandbox (locked-down stub)
  # ---------------------------------------------------------------------
  sandbox:
    <<: *service-base
    container_name: apts-sandbox
    hostname: sandbox
    depends_on:
      database: { condition: service_healthy }
    command: >
      python -m sandbox.main
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    secrets:
      - source: sandbox_token
        target: token
      - source: sandbox_key
        target: tls_key
    volumes:
      - ./certs/sandbox.crt:/etc/apts/tls.crt:ro
      - ./certs/trust-bundle.pem:/etc/apts/trust-bundle.pem:ro
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.5", pids: 64 }


# =========================================================================
#  Volumes, networks, and secrets
# =========================================================================
volumes:
  db_data: {}

networks:
  apts-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: apts0

secrets:
  # DB password
  db_password:            { file: ./tokens/db_password.txt }
  # Bearer tokens
  orchestrator_token:     { file: ./tokens/orchestrator.token }
  agent_recon_token:      { file: ./tokens/agent-recon.token }
  agent_vuln_token:       { file: ./tokens/agent-vuln.token }
  agent_mitre_token:      { file: ./tokens/agent-mitre.token }
  agent_exploit_token:    { file: ./tokens/agent-exploit.token }
  agent_script_token:     { file: ./tokens/agent-script.token }
  agent_adviser_token:    { file: ./tokens/agent-adviser.token }
  mcp_tools_token:        { file: ./tokens/mcp-tools.token }
  sandbox_token:          { file: ./tokens/sandbox.token }
  # TLS private keys
  orchestrator_key:       { file: ./certs/orchestrator.key }
  agent_recon_key:        { file: ./certs/agent-recon.key }
  agent_vuln_key:         { file: ./certs/agent-vuln.key }
  agent_mitre_key:        { file: ./certs/agent-mitre.key }
  agent_exploit_key:      { file: ./certs/agent-exploit.key }
  agent_script_key:       { file: ./certs/agent-script.key }
  agent_adviser_key:      { file: ./certs/agent-adviser.key }
  mcp_tools_key:          { file: ./certs/mcp-tools.key }
  sandbox_key:            { file: ./certs/sandbox.key }
